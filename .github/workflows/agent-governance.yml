name: Agent governance
on:
  pull_request:
  push:
    branches:
      - codex/agent-operating-system
permissions:
  contents: read
jobs:
  contracts-and-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Validate contracts, review binding, content and unit tests
        run: python -B tools/agents/repository_check.py --require-handoffs
